name: binary_translator
description: Translate text to binary and binary back to text.
publish_to: 'none'

# Only the name part is used by CI: the build number comes from the
# GitHub Actions run number so every release has a unique versionCode.
version: 1.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
